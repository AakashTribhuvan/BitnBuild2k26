services:
  postgres:
    image: postgres:16-alpine
    container_name: fairdrop-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
      POSTGRES_DB: ${POSTGRES_DB:-fairdrop}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-fairdrop}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: fairdrop-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: fairdrop-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      PORT: 4000
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-password}@postgres:5432/${POSTGRES_DB:-fairdrop}
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET:-local-development-only-change-before-deployment}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-7d}
      SEAT_HOLD_MINUTES: ${SEAT_HOLD_MINUTES:-10}
      QUEUE_GRANT_SECONDS: ${QUEUE_GRANT_SECONDS:-600}
      QUEUE_REQUIRE_GOOGLE: ${QUEUE_REQUIRE_GOOGLE:-true}
      TURNSTILE_SECRET_KEY: ${TURNSTILE_SECRET_KEY:-}
      TURNSTILE_SITE_KEY: ${NEXT_PUBLIC_TURNSTILE_SITE_KEY:-}
      TURNSTILE_REQUIRED: ${TURNSTILE_REQUIRED:-false}
      ADMIN_SECRET: ${ADMIN_SECRET:-local-development-only-change-before-deployment}
      CORSORIGIN: ${FRONTEND_ORIGIN:-http://localhost:3000},http://localhost:3000,http://127.0.0.1:3000
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      DEMO_AUTH_ENABLED: ${DEMO_AUTH_ENABLED:-false}
      SIMULATIONS_ENABLED: ${SIMULATIONS_ENABLED:-false}
    ports:
      - "4000:4000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4000/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 12

  frontend:
    container_name: fairdrop-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:4000}
        NEXT_PUBLIC_GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
        NEXT_PUBLIC_TURNSTILE_SITE_KEY: ${NEXT_PUBLIC_TURNSTILE_SITE_KEY:-}
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:4000}
      NEXT_PUBLIC_GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      NEXT_PUBLIC_TURNSTILE_SITE_KEY: ${NEXT_PUBLIC_TURNSTILE_SITE_KEY:-}
      FAIRDROP_INTERNAL_API_URL: http://backend:4000
    ports:
      - "3000:3000"

volumes:
  postgres_data:
  redis_data:
